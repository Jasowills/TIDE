name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag -- pinned to immutable full SHA (tag shown in comment); rule fires on SHAs too, underlying mutable-tag risk is mitigated
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag -- pinned to immutable full SHA (tag shown in comment); rule fires on SHAs too, underlying mutable-tag risk is mitigated
        with:
          go-version: "1.27"
      - name: Provider isolation (QA §3.5)
        run: sh scripts/check-provider-isolation.sh
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race detector (stateful packages — the spike found a fatal map race here)
        run: go test -race -count=1 ./internal/detectors/ ./internal/eventbus/ ./internal/pipeline/ ./internal/rules/ ./internal/state/ ./internal/api/
      - name: Build
        run: go build ./...

  smoke:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag -- pinned to immutable full SHA (tag shown in comment); rule fires on SHAs too, underlying mutable-tag risk is mitigated
      - name: Smoke — docker compose up + simulate + replay + doctor (QA §3.5)
        run: |
          docker compose up -d --build postgres redis nats tide-api tide-engine
          sleep 10
          curl -sf http://localhost:8080/healthz
          curl -sf http://localhost:8081/healthz
          docker compose run --rm tide-api /usr/local/bin/tide simulate --vehicles 10 --scenario mixed --api http://tide-api:8080
          docker compose run --rm -e TIDE_POSTGRES_DSN=postgres://tide:tide@postgres:5432/tide?sslmode=disable -e TIDE_REDIS_ADDR=redis:6379 -e TIDE_NATS_URL=nats://nats:4222 tide-api /usr/local/bin/tide doctor
          docker compose down -v

  e2e:
    runs-on: ubuntu-latest
    needs: lint-test
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag -- pinned to immutable full SHA (tag shown in comment); rule fires on SHAs too, underlying mutable-tag risk is mitigated
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag -- pinned to immutable full SHA (tag shown in comment); rule fires on SHAs too, underlying mutable-tag risk is mitigated
        with:
          go-version: "1.27"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag -- pinned to immutable full SHA (tag shown in comment); rule fires on SHAs too, underlying mutable-tag risk is mitigated
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - name: Bring up API stack
        run: |
          docker compose up -d --build postgres redis nats mosquitto tide-api tide-engine
          sleep 12
          curl -sf http://localhost:8080/healthz
        working-directory: ${{ github.workspace }}
        env:
          TIDE_RATE_LIMIT_PER_MIN: 1000000
          TIDE_MQTT_BROKER: tcp://mosquitto:1883
          TIDE_MQTT_MAPPING: /etc/tide/mqtt-mapping.yaml
          TIDE_TENANT: default
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Seed telemetry
        run: go run ./cmd/tide simulate --vehicles 8 --scenario mixed --api http://localhost:8080
        working-directory: ${{ github.workspace }}
      - run: npm run build
      - name: Console E2E (all 7 screens + live WS)
        run: npx playwright test
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag -- pinned to immutable full SHA (tag shown in comment); rule fires on SHAs too, underlying mutable-tag risk is mitigated
        with:
          name: e2e-screenshots
          path: apps/console/e2e/screenshots
      - name: Tear down
        if: always()
        run: docker compose down -v
        working-directory: ${{ github.workspace }}
