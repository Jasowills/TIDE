name: chaos

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  live-chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag -- pinned to immutable full SHA (tag shown in comment); rule fires on SHAs too, underlying mutable-tag risk is mitigated
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag -- pinned to immutable full SHA (tag shown in comment); rule fires on SHAs too, underlying mutable-tag risk is mitigated
        with:
          go-version: "1.27"
      - name: Bring up stack
        run: docker compose up -d --build postgres redis nats tide-api tide-engine
      - name: Live chaos (DB/Redis/NATS restart, malformed storms)
        run: TIDE_CHAOS_LIVE=1 go test ./tests/ -v
      - name: Redis restart recovery
        run: |
          docker restart tide-redis-1
          sleep 8
          go run ./cmd/tide doctor
      - name: Tear down
        if: always()
        run: docker compose down -v
